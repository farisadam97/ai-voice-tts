<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noa VTuber</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #16213e;
    padding: 12px 20px;
    border-bottom: 1px solid #0f3460;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 18px; color: #e94560; }
  header span { font-size: 13px; color: #888; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: #0f3460;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: #233554;
    border-bottom-left-radius: 4px;
  }
  .msg .audio-btn {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 10px;
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
  }
  .msg .audio-btn:hover { background: #c73652; }
  .msg .audio-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg.error { background: #5c1a1a; color: #ff8888; }
  #input-area {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    background: #16213e;
    border-top: 1px solid #0f3460;
  }
  #input {
    flex: 1;
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid #0f3460;
    background: #1a1a2e;
    color: #e0e0e0;
    font-size: 14px;
    outline: none;
  }
  #input:focus { border-color: #e94560; }
  #send {
    padding: 10px 24px;
    border-radius: 12px;
    border: none;
    background: #e94560;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  #send:hover { background: #c73652; }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }
  .loading { display: none; color: #888; font-size: 13px; padding: 0 20px 8px; }
  .loading.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>Noa</h1>
  <span id="status">Connecting...</span>
</header>
<div id="chat"></div>
<div class="loading" id="loading">Noa is thinking...</div>
<div id="input-area">
  <input id="input" type="text" placeholder="Say something..." autocomplete="off">
  <button id="send">Send</button>
</div>

<audio id="player"></audio>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const loading = document.getElementById('loading');
const statusEl = document.getElementById('status');
const player = document.getElementById('player');

function addMessage(text, type, audioUrl) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  if (audioUrl) {
    const btn = document.createElement('button');
    btn.className = 'audio-btn';
    btn.textContent = 'Play Audio';
    btn.onclick = () => {
      player.src = audioUrl;
      player.play();
      btn.disabled = true;
      btn.textContent = 'Playing...';
      player.onended = () => { btn.disabled = false; btn.textContent = 'Play Audio'; };
    };
    div.appendChild(document.createElement('br'));
    div.appendChild(btn);
    player.src = audioUrl;
    player.play();
    btn.disabled = true;
    btn.textContent = 'Playing...';
    player.onended = () => { btn.disabled = false; btn.textContent = 'Play Audio'; };
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage(text, 'user');
  sendBtn.disabled = true;
  loading.classList.add('show');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    if (data.error && !data.text) {
      addMessage(data.error, 'error');
    } else {
      addMessage(data.text, 'bot', data.audio);
    }
  } catch (e) {
    addMessage('Connection error. Is the server running?', 'error');
  }

  sendBtn.disabled = false;
  loading.classList.remove('show');
  input.focus();
}

sendBtn.onclick = sendMessage;
input.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

fetch('/api/status')
  .then(r => r.json())
  .then(d => { statusEl.textContent = d.tts_loaded ? 'TTS Ready' : 'TTS Not Loaded'; })
  .catch(() => { statusEl.textContent = 'Offline'; });

input.focus();
</script>
</body>
</html>
